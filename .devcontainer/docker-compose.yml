services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces/${localWorkspaceFolderBasename}:cached
    command: sleep infinity
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:5055
      ConnectionStrings__DefaultConnection: Server=db,1433;Database=SISTEMPLATE_DB;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Dev_Password123!};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True
      AzureBlob__UseLocalStorage: "true"
      AzureBlob__LocalRoot: /workspaces/${localWorkspaceFolderBasename}/.run/blob-storage
      Auth__AllowPasswordlessDevLogin: "true"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Dev_Password123!}
    volumes:
      - mssql-data:/var/opt/mssql
    ports:
      - "1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  mssql-data:
