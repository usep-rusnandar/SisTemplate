# Copy Administrative Regions master data (province/city/district/village)
# from a GitHub Release snapshot into Staging or Production SQL.
# Does not run on push. Confirm phrase must match the target.
name: Copy Wilayah Snapshot

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which App Service SQL to replace"
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      confirm:
        description: "COPY-STAGING or COPY-PRODUCTION"
        required: true
        type: string
      release_tag:
        description: "GitHub release tag that holds wilayah-master-snapshot.jsonl.gz"
        required: true
        type: string
        default: "wilayah-snapshot-20260826"

concurrency:
  group: copy-wilayah-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  copy:
    name: Copy wilayah snapshot → ${{ inputs.target }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - name: Guard confirm phrase
        run: |
          set -euo pipefail
          target="${{ inputs.target }}"
          confirm="${{ inputs.confirm }}"
          case "$target" in
            staging) expected="COPY-STAGING" ;;
            production) expected="COPY-PRODUCTION" ;;
            *) echo "::error::Unknown target"; exit 1 ;;
          esac
          if [ "$confirm" != "$expected" ]; then
            echo "::error::Refusing copy. For target=$target type $expected in the confirm input."
            exit 1
          fi
          echo "Confirmed $expected for $target"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download snapshot from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${{ inputs.release_tag }}" \
            --pattern "wilayah-master-snapshot.jsonl.gz" \
            --dir /tmp
          ls -lh /tmp/wilayah-master-snapshot.jsonl.gz

      - name: Resolve SQL from App Service (Kudu)
        env:
          COPY_TARGET: ${{ inputs.target }}
          PROFILE_PRODUCTION: ${{ secrets.AZUREWEBAPP_PUBLISHPROFILE_PRODUCTION }}
          PROFILE_STAGING: ${{ secrets.AZUREWEBAPP_PUBLISHPROFILE_STAGING }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, ssl, urllib.request, xml.etree.ElementTree as ET
          import base64

          def parse_msdeploy(xml_text, prefer_staging: bool):
              root = ET.fromstring(xml_text)
              candidates = []
              for p in root.findall(".//publishProfile"):
                  method = (p.get("publishMethod") or "")
                  if method not in ("MSDeploy", "ZipDeploy"):
                      continue
                  url = (p.get("publishUrl") or p.get("publishProfileUrl") or "")
                  dest = (p.get("destinationAppUrl") or "")
                  user = p.get("userName") or ""
                  pwd = p.get("userPWD") or ""
                  if not user or not pwd:
                      continue
                  is_stg = "-staging" in dest.lower() or "-staging" in url.lower()
                  candidates.append((is_stg, url, dest, user, pwd))
              if not candidates:
                  raise SystemExit("No MSDeploy/ZipDeploy profile with credentials")
              wanted = [c for c in candidates if c[0] == prefer_staging]
              pick = (wanted or candidates)[0]
              scm = pick[1]
              if "scm." not in scm.lower():
                  dest = pick[2].rstrip("/")
                  host = dest.replace("https://", "").replace("http://", "").split("/")[0]
                  if host.endswith(".azurewebsites.net"):
                      scm = host.replace(".azurewebsites.net", ".scm.azurewebsites.net")
                  else:
                      scm = host
              scm = re.sub(r"^https?://", "", scm).split(":")[0]
              return scm, pick[3], pick[4], pick[2]

          def kudu_settings(scm, user, pwd):
              url = f"https://{scm}/api/settings"
              req = urllib.request.Request(url, headers={"User-Agent": "copy-wilayah-workflow", "Accept": "application/json"})
              req.add_header("Authorization", "Basic " + base64.b64encode(f"{user}:{pwd}".encode()).decode())
              ctx = ssl.create_default_context()
              with urllib.request.urlopen(req, timeout=60, context=ctx) as r:
                  return json.load(r)

          def conn_from_settings(settings: dict):
              keys = [
                  "ConnectionStrings__DefaultConnection",
                  "SQLAZURECONNSTR_DefaultConnection",
                  "SQLCONNSTR_DefaultConnection",
                  "DefaultConnection",
              ]
              for k in keys:
                  v = settings.get(k)
                  if v:
                      return k, v
              for k, v in settings.items():
                  if not isinstance(v, str):
                      continue
                  kl = k.lower()
                  if "defaultconnection" in kl.replace(":", "__") or kl.endswith("defaultconnection"):
                      return k, v
              raise SystemExit("DefaultConnection not found in Kudu /api/settings")

          def server_db(cs: str):
              def grab(name):
                  m = re.search(rf"(?:^|;){name}=([^;]+)", cs, re.I)
                  return m.group(1).strip() if m else ""
              return grab("Server") or grab("Data Source"), grab("Database") or grab("Initial Catalog")

          def mask(cs: str, *extra):
              for secret in extra:
                  if secret:
                      print(f"::add-mask::{secret}")
              print(f"::add-mask::{cs}")
              m = re.search(r"Password=([^;]+)", cs, re.I)
              if m:
                  print(f"::add-mask::{m.group(1)}")

          def resolve(xml, prefer_staging, label):
              if not (xml or "").strip():
                  raise SystemExit(f"Publish profile secret for {label} is empty")
              scm, user, pwd, dest = parse_msdeploy(xml, prefer_staging=prefer_staging)
              print(f"{label} SCM host={scm} dest={dest}")
              settings = kudu_settings(scm, user, pwd)
              src_key, cs = conn_from_settings(settings)
              mask(cs, pwd, user)
              server, database = server_db(cs)
              print(f"{label} SQL source_key={src_key} server={server} database={database}")
              return cs, server, database

          target = os.environ["COPY_TARGET"]
          prod_xml = os.environ.get("PROFILE_PRODUCTION") or ""
          stg_xml = os.environ.get("PROFILE_STAGING") or ""

          if target == "staging":
              cs, server, database = resolve(stg_xml, True, "Staging")
              other_label, other_xml, other_stg = "Production", prod_xml, False
              if "sqlmisis-prod" in server.lower():
                  raise SystemExit("ABORT: staging App Service connection looks like production SQL (sqlmisis-prod).")
          elif target == "production":
              cs, server, database = resolve(prod_xml, False, "Production")
              other_label, other_xml, other_stg = "Staging", stg_xml, True
              if "sqlmisis-test" in server.lower():
                  print("::warning::Production connection server looks like the testing SQL host.")
          else:
              raise SystemExit(f"Unknown target {target}")

          if other_xml.strip():
              try:
                  _, other_server, other_db = resolve(other_xml, other_stg, other_label)
                  if (server.lower(), database.lower()) == (other_server.lower(), other_db.lower()):
                      raise SystemExit(
                          f"ABORT: {target} and {other_label.lower()} App Services point at the same SQL database."
                      )
              except SystemExit:
                  raise
              except Exception as e:
                  print(f"::warning::Could not compare {other_label} SQL ({type(e).__name__}). Continuing with {target} only.")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"WIPE_SQL_CONNECTION<<EOF\n{cs}\nEOF\n")
              f.write(f"COPY_SQL_SERVER={server}\n")
              f.write(f"COPY_SQL_DATABASE={database}\n")
          PY

      - name: Install pymssql
        run: pip install pymssql

      - name: Replace region master data
        env:
          WIPE_SQL_CONNECTION: ${{ env.WIPE_SQL_CONNECTION }}
        run: python3 tools/database/copy-wilayah-snapshot.py import --from /tmp/wilayah-master-snapshot.jsonl.gz
