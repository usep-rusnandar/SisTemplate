# Manual wipe of transactional data (not IAM, master data, or settings).
# Does not run on push. Confirm phrase must match the target.
name: Wipe Transactional Data

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which App Service SQL to wipe"
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      scope:
        description: "all = wipe vendors/Tracker/CIP/CM + emails; tracker-and-cm = Tracker+Term Sheet+CM only (keeps vendors); vendor-invitations = invitation rows + invitation-created vendors only; contract-monitoring = wipe cm.* only; export-commodity = read-only JSON dump of commodity master data (no deletes)"
        required: true
        type: choice
        options:
          - all
          - tracker-and-cm
          - vendor-invitations
          - contract-monitoring
          - export-commodity
        default: all
      confirm:
        description: "WIPE-STAGING / WIPE-PRODUCTION, or EXPORT-STAGING / EXPORT-PRODUCTION when scope is export-commodity"
        required: true
        type: string

concurrency:
  group: wipe-transactional-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  wipe:
    name: ${{ inputs.scope == 'export-commodity' && format('Export commodity ({0})', inputs.target) || format('Wipe {0} ({1})', inputs.target, inputs.scope) }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - name: Guard confirm phrase
        run: |
          set -euo pipefail
          target="${{ inputs.target }}"
          confirm="${{ inputs.confirm }}"
          scope="${{ inputs.scope }}"
          if [ "$scope" = "export-commodity" ]; then
            case "$target" in
              staging) expected="EXPORT-STAGING" ;;
              production) expected="EXPORT-PRODUCTION" ;;
              *) echo "::error::Unknown target"; exit 1 ;;
            esac
            if [ "$confirm" != "$expected" ]; then
              echo "::error::Refusing export. For target=$target type $expected in the confirm input."
              exit 1
            fi
            echo "Confirmed read-only $expected for $target scope=$scope"
          else
            case "$target" in
              staging) expected="WIPE-STAGING" ;;
              production) expected="WIPE-PRODUCTION" ;;
              *) echo "::error::Unknown target"; exit 1 ;;
            esac
            if [ "$confirm" != "$expected" ]; then
              echo "::error::Refusing to wipe. For target=$target type $expected in the confirm input."
              exit 1
            fi
            echo "Confirmed $expected for $target scope=$scope"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve SQL from App Service (Kudu)
        env:
          WIPE_TARGET: ${{ inputs.target }}
          PROFILE_PRODUCTION: ${{ secrets.AZUREWEBAPP_PUBLISHPROFILE_PRODUCTION }}
          PROFILE_STAGING: ${{ secrets.AZUREWEBAPP_PUBLISHPROFILE_STAGING }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, ssl, urllib.request, xml.etree.ElementTree as ET
          import base64

          def parse_msdeploy(xml_text, prefer_staging: bool):
              root = ET.fromstring(xml_text)
              candidates = []
              for p in root.findall(".//publishProfile"):
                  method = (p.get("publishMethod") or "")
                  if method not in ("MSDeploy", "ZipDeploy"):
                      continue
                  url = (p.get("publishUrl") or p.get("publishProfileUrl") or "")
                  dest = (p.get("destinationAppUrl") or "")
                  user = p.get("userName") or ""
                  pwd = p.get("userPWD") or ""
                  if not user or not pwd:
                      continue
                  is_stg = "-staging" in dest.lower() or "-staging" in url.lower()
                  candidates.append((is_stg, url, dest, user, pwd))
              if not candidates:
                  raise SystemExit("No MSDeploy/ZipDeploy profile with credentials")
              wanted = [c for c in candidates if c[0] == prefer_staging]
              pick = (wanted or candidates)[0]
              scm = pick[1]
              if "scm." not in scm.lower():
                  dest = pick[2].rstrip("/")
                  host = dest.replace("https://", "").replace("http://", "").split("/")[0]
                  if host.endswith(".azurewebsites.net"):
                      scm = host.replace(".azurewebsites.net", ".scm.azurewebsites.net")
                  else:
                      scm = host
              scm = re.sub(r"^https?://", "", scm).split(":")[0]
              return scm, pick[3], pick[4], pick[2]

          def kudu_settings(scm, user, pwd):
              url = f"https://{scm}/api/settings"
              req = urllib.request.Request(url, headers={"User-Agent": "wipe-workflow", "Accept": "application/json"})
              req.add_header("Authorization", "Basic " + base64.b64encode(f"{user}:{pwd}".encode()).decode())
              ctx = ssl.create_default_context()
              with urllib.request.urlopen(req, timeout=60, context=ctx) as r:
                  return json.load(r)

          def conn_from_settings(settings: dict):
              keys = [
                  "ConnectionStrings__DefaultConnection",
                  "SQLAZURECONNSTR_DefaultConnection",
                  "SQLCONNSTR_DefaultConnection",
                  "DefaultConnection",
              ]
              for k in keys:
                  v = settings.get(k)
                  if v:
                      return k, v
              for k, v in settings.items():
                  if not isinstance(v, str):
                      continue
                  kl = k.lower()
                  if "defaultconnection" in kl.replace(":", "__") or kl.endswith("defaultconnection"):
                      return k, v
              raise SystemExit("DefaultConnection not found in Kudu /api/settings")

          def server_db(cs: str):
              def grab(name):
                  m = re.search(rf"(?:^|;){name}=([^;]+)", cs, re.I)
                  return m.group(1).strip() if m else ""
              return grab("Server") or grab("Data Source"), grab("Database") or grab("Initial Catalog")

          def mask(cs: str, *extra):
              for secret in extra:
                  if secret:
                      print(f"::add-mask::{secret}")
              print(f"::add-mask::{cs}")
              m = re.search(r"Password=([^;]+)", cs, re.I)
              if m:
                  print(f"::add-mask::{m.group(1)}")

          def resolve(xml, prefer_staging, label):
              if not (xml or "").strip():
                  raise SystemExit(f"Publish profile secret for {label} is empty")
              scm, user, pwd, dest = parse_msdeploy(xml, prefer_staging=prefer_staging)
              print(f"{label} SCM host={scm} dest={dest}")
              settings = kudu_settings(scm, user, pwd)
              src_key, cs = conn_from_settings(settings)
              mask(cs, pwd, user)
              server, database = server_db(cs)
              print(f"{label} SQL source_key={src_key} server={server} database={database}")
              return cs, server, database

          target = os.environ["WIPE_TARGET"]
          prod_xml = os.environ.get("PROFILE_PRODUCTION") or ""
          stg_xml = os.environ.get("PROFILE_STAGING") or ""

          if target == "staging":
              cs, server, database = resolve(stg_xml, True, "Staging")
              other_label, other_xml, other_stg = "Production", prod_xml, False
              if "sqlmisis-prod" in server.lower():
                  raise SystemExit("ABORT: staging App Service connection looks like production SQL (sqlmisis-prod).")
          elif target == "production":
              cs, server, database = resolve(prod_xml, False, "Production")
              other_label, other_xml, other_stg = "Staging", stg_xml, True
              if "sqlmisis-test" in server.lower():
                  print("::warning::Production connection server looks like the testing SQL host.")
          else:
              raise SystemExit(f"Unknown target {target}")

          if other_xml.strip():
              try:
                  _, other_server, other_db = resolve(other_xml, other_stg, other_label)
                  if (server.lower(), database.lower()) == (other_server.lower(), other_db.lower()):
                      raise SystemExit(
                          f"ABORT: {target} and {other_label.lower()} App Services point at the same SQL database."
                      )
              except SystemExit:
                  raise
              except Exception as e:
                  print(f"::warning::Could not compare {other_label} SQL ({type(e).__name__}). Continuing with {target} only.")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"WIPE_SQL_CONNECTION<<EOF\n{cs}\nEOF\n")
              f.write(f"WIPE_SQL_SERVER={server}\n")
              f.write(f"WIPE_SQL_DATABASE={database}\n")
              f.write(f"WIPE_SQL_TARGET={target}\n")
          PY

      - name: Install pymssql
        run: pip install pymssql

      - name: Export commodity master data (read-only)
        if: inputs.scope == 'export-commodity'
        env:
          WIPE_SQL_CONNECTION: ${{ env.WIPE_SQL_CONNECTION }}
        run: |
          set -euo pipefail
          python3 tools/database/export-commodity-seed.py --out-dir commodity-export

      - name: Upload commodity export
        if: inputs.scope == 'export-commodity'
        uses: actions/upload-artifact@v4
        with:
          name: commodity-export-${{ inputs.target }}
          path: commodity-export
          if-no-files-found: error

      - name: Execute wipe SQL
        if: inputs.scope != 'export-commodity'
        env:
          WIPE_SQL_CONNECTION: ${{ env.WIPE_SQL_CONNECTION }}
          WIPE_SQL_TARGET: ${{ env.WIPE_SQL_TARGET }}
          WIPE_SQL_SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, pymssql
          cs = os.environ["WIPE_SQL_CONNECTION"]
          target = os.environ.get("WIPE_SQL_TARGET", "")
          scope = (os.environ.get("WIPE_SQL_SCOPE") or "all").strip().lower()
          if scope in ("export-commodity", "export_commodity"):
              raise SystemExit("ABORT: export-commodity is read-only and must not execute wipe SQL")
          def grab(name, default=""):
              m = re.search(rf"(?:^|;){re.escape(name)}=([^;]*)", cs, re.I)
              return m.group(1).strip() if m else default
          server = grab("Server") or grab("Data Source")
          database = grab("Database") or grab("Initial Catalog")
          user = grab("User Id") or grab("User ID") or grab("Uid")
          pwd = grab("Password") or grab("Pwd")
          host, port = (server.split(",", 1) + ["1433"])[:2]
          host = host.strip()
          port = int(re.sub(r"\D", "", port) or "1433")
          if scope in ("contract-monitoring", "cm", "contract_monitoring"):
              sql_file = "tools/database/wipe-contract-monitoring.sql"
          elif scope in ("tracker-and-cm", "tracker_and_cm", "tracker-cm"):
              sql_file = "tools/database/wipe-tracker-and-cm.sql"
          elif scope in ("vendor-invitations", "vendor_invitations", "invitations"):
              sql_file = "tools/database/wipe-vendor-invitations.sql"
          else:
              sql_file = "tools/database/wipe-transactional.sql"
          sql = open(sql_file, encoding="utf-8").read()
          print(f"Executing wipe target={target} scope={scope} file={sql_file} database={database} host={host} port={port}")
          conn = pymssql.connect(
              server=host,
              port=port,
              user=user,
              password=pwd,
              database=database,
              timeout=120,
              login_timeout=45,
              tds_version="7.4",
          )
          cur = conn.cursor()
          cur.execute(sql)
          while True:
              try:
                  rows = cur.fetchall()
              except Exception:
                  rows = None
              if rows:
                  if cur.description:
                      print(" | ".join(c[0] for c in cur.description))
                  for row in rows:
                      print(" | ".join("" if v is None else str(v) for v in row))
              if not cur.nextset():
                  break
          conn.commit()
          cur.close()
          conn.close()
          print("Wipe finished.")
          PY
