# Deploy Internal AppHost (API + SPA internal) to Azure App Service via Publish Profile.
# No Microsoft Entra / OIDC App Registration required.
# Setup: docs/deployment-github.md
# Do NOT use Azure App Service "Deployment Center → GitHub" (Oryx) for this repo —
# the SPA must be built with npm run build:internal before dotnet publish.
#
# Triggers:
#   - push to master → always staging (automatic)
#   - workflow_dispatch → staging or production (manual)
name: Deploy Internal

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy-internal.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "App Service destination"
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      ref:
        description: "Git ref to deploy (branch, tag, or SHA). Leave empty = this workflow's branch tip."
        required: false
        type: string
        default: ""
      skip_health_check:
        description: "Skip post-deploy health checks"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-internal-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "20"
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
  # Push → staging; manual → inputs.target
  DEPLOY_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}

jobs:
  deploy-internal:
    name: Build & deploy internal → ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}
    runs-on: ubuntu-latest
    # Optional reviewers / protection rules (not used for OIDC).
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Resolve slot & health host
        id: dest
        run: |
          set -euo pipefail
          app="${{ env.AZURE_WEBAPP_NAME }}"
          target="${{ env.DEPLOY_TARGET }}"
          if [ -z "$app" ]; then
            echo "::error::Set repository Variable AZURE_WEBAPP_NAME. See docs/deployment-github.md"
            exit 1
          fi
          if [ "$target" = "production" ]; then
            slot=""
            host="https://${app}.azurewebsites.net"
            echo "slot=" >> "$GITHUB_OUTPUT"
            echo "use_slot=false" >> "$GITHUB_OUTPUT"
          else
            slot="${{ vars.AZURE_SLOT_NAME || 'staging' }}"
            host="https://${app}-${slot}.azurewebsites.net"
            echo "slot=$slot" >> "$GITHUB_OUTPUT"
            echo "use_slot=true" >> "$GITHUB_OUTPUT"
          fi
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "Target=$target host=$host slot=${slot:-'(production site)'}"

      - name: Validate publish profile secret
        env:
          PROFILE_STAGING: ${{ secrets.AZUREWEBAPP_PUBLISHPROFILE_STAGING }}
          PROFILE_PRODUCTION: ${{ secrets.AZUREWEBAPP_PUBLISHPROFILE_PRODUCTION }}
        run: |
          set -euo pipefail
          if [ "${{ env.DEPLOY_TARGET }}" = "production" ]; then
            label="AZUREWEBAPP_PUBLISHPROFILE_PRODUCTION"
            test -n "$PROFILE_PRODUCTION" || { echo "::error::Secret $label is not set. See docs/deployment-github.md"; exit 1; }
          else
            label="AZUREWEBAPP_PUBLISHPROFILE_STAGING"
            test -n "$PROFILE_STAGING" || { echo "::error::Secret $label is not set. See docs/deployment-github.md"; exit 1; }
          fi
          echo "Secret $label is present for target=${{ env.DEPLOY_TARGET }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build frontend (internal SPA)
        working-directory: frontend
        run: |
          npm ci
          npm run build:internal
          test -f dist/internal/index.html

      - name: Publish backend (+ bundle SPA into wwwroot)
        run: |
          dotnet publish backend/src/AppHost/IntegratedProcurement.AppHost.Api.csproj \
            -c Release \
            -o publish/internal \
            --nologo
          test -f publish/internal/wwwroot/index.html
          test -f publish/internal/IntegratedProcurement.AppHost.Api.dll

      - name: Zip artifact
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip
          (cd publish/internal && zip -r -q ../internal.zip .)
          ls -lh publish/internal.zip

      - name: Deploy to App Service (staging slot)
        if: ${{ steps.dest.outputs.use_slot == 'true' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: ${{ steps.dest.outputs.slot }}
          publish-profile: ${{ secrets.AZUREWEBAPP_PUBLISHPROFILE_STAGING }}
          package: publish/internal.zip

      - name: Deploy to App Service (production)
        if: ${{ steps.dest.outputs.use_slot == 'false' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZUREWEBAPP_PUBLISHPROFILE_PRODUCTION }}
          package: publish/internal.zip

      - name: Health checks
        # On push, inputs are empty → always run. On manual, honour skip_health_check.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_health_check != true }}
        env:
          HOST: ${{ steps.dest.outputs.host }}
        run: |
          set -euo pipefail
          echo "Waiting for $HOST …"
          sleep 25
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/live.json -w "%{http_code}" "$HOST/api/health/live" || true)
            echo "attempt $i → HTTP $code"
            if [ "$code" = "200" ]; then
              cat /tmp/live.json
              echo
              curl -sS "$HOST/api/v1/about" | head -c 200 || true
              echo
              exit 0
            fi
            sleep 15
          done
          echo "::error::Health check failed for $HOST/api/health/live"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "## Deploy Internal (Publish Profile)"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo "| Target | \`${{ env.DEPLOY_TARGET }}\` |"
            echo "| Ref | \`${{ github.sha }}\` |"
            echo "| App | \`$AZURE_WEBAPP_NAME\` |"
            echo "| URL | ${{ steps.dest.outputs.host }} |"
            echo ""
            echo "Auth: App Service publish profile (no Entra OIDC)."
            echo "App settings / connection strings stay on the App Service."
            echo "Push to \`master\` → staging automatically. Production remains manual."
            echo "Vendor portal: docs/deployment-github-vendor.md"
            echo "Setup: docs/deployment-github.md"
          } >> "$GITHUB_STEP_SUMMARY"
