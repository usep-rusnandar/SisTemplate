# Apply SharePoint__ClientSecret to contractone App Service (Kudu), without putting
# the value in git. Secret lives in GitHub Actions secret SHAREPOINT_CLIENT_SECRET.
# TenantId / ClientId match committed appsettings (App Registration IntegratedProcurement-SharePoint).
#
# Temporary Go Live path while Managed Identity Graph grants are broken.
# To return to MI later: run workflow "Clear SharePoint App Settings".
name: Set SharePoint Client Secret

on:
  workflow_dispatch:
    inputs:
      target:
        description: "App Service slot(s)"
        required: true
        type: choice
        options:
          - staging
          - production
          - both
        default: both
      confirm:
        description: "SET-STAGING / SET-PRODUCTION / SET-BOTH"
        required: true
        type: string

concurrency:
  group: set-sharepoint-secret-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SHAREPOINT_TENANT_ID: "6840a32b-bf04-4bb1-80d2-5bea07d4905f"
  SHAREPOINT_CLIENT_ID: "d5f6728d-4c47-4df0-a18c-3a3bee0f690e"

jobs:
  apply:
    name: Set SharePoint secret → ${{ inputs.target }}
    runs-on: ubuntu-latest
    # "both" uses repo secrets (empty environment) so production reviewers do not block Go Live.
    environment: ${{ inputs.target == 'production' && 'production' || inputs.target == 'staging' && 'staging' || '' }}
    steps:
      - name: Guard confirm phrase
        run: |
          set -euo pipefail
          target="${{ inputs.target }}"
          confirm="${{ inputs.confirm }}"
          case "$target" in
            staging) expected="SET-STAGING" ;;
            production) expected="SET-PRODUCTION" ;;
            both) expected="SET-BOTH" ;;
            *) echo "::error::Unknown target"; exit 1 ;;
          esac
          if [ "$confirm" != "$expected" ]; then
            echo "::error::Refusing. For target=$target type $expected in the confirm input."
            exit 1
          fi
          echo "Confirmed $expected"

      - name: Apply via Kudu (no echo of secret)
        env:
          APPLY_TARGET: ${{ inputs.target }}
          PROFILE_PRODUCTION: ${{ secrets.AZUREWEBAPP_PUBLISHPROFILE_PRODUCTION }}
          PROFILE_STAGING: ${{ secrets.AZUREWEBAPP_PUBLISHPROFILE_STAGING }}
          SHAREPOINT_CLIENT_SECRET: ${{ secrets.SHAREPOINT_CLIENT_SECRET }}
          SHAREPOINT_TENANT_ID: ${{ env.SHAREPOINT_TENANT_ID }}
          SHAREPOINT_CLIENT_ID: ${{ env.SHAREPOINT_CLIENT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, re, ssl, urllib.error, urllib.request, xml.etree.ElementTree as ET

          secret = (os.environ.get("SHAREPOINT_CLIENT_SECRET") or "").strip()
          if not secret:
              raise SystemExit("GitHub secret SHAREPOINT_CLIENT_SECRET is empty. Set it in repo Settings → Secrets and variables → Actions.")
          print(f"::add-mask::{secret}")

          payload = {
              "SharePoint__TenantId": os.environ["SHAREPOINT_TENANT_ID"],
              "SharePoint__ClientId": os.environ["SHAREPOINT_CLIENT_ID"],
              "SharePoint__ClientSecret": secret,
              "SharePoint__DownloadTimeoutSeconds": "90",
          }

          def parse_msdeploy(xml_text, prefer_staging: bool):
              root = ET.fromstring(xml_text)
              candidates = []
              for p in root.findall(".//publishProfile"):
                  method = (p.get("publishMethod") or "")
                  if method not in ("MSDeploy", "ZipDeploy"):
                      continue
                  url = (p.get("publishUrl") or p.get("publishProfileUrl") or "")
                  dest = (p.get("destinationAppUrl") or "")
                  user = p.get("userName") or ""
                  pwd = p.get("userPWD") or ""
                  if not user or not pwd:
                      continue
                  is_stg = "-staging" in dest.lower() or "-staging" in url.lower()
                  candidates.append((is_stg, url, dest, user, pwd))
              if not candidates:
                  raise SystemExit("No MSDeploy/ZipDeploy profile with credentials")
              wanted = [c for c in candidates if c[0] == prefer_staging]
              pick = (wanted or candidates)[0]
              scm = pick[1]
              if "scm." not in scm.lower():
                  dest = pick[2].rstrip("/")
                  host = dest.replace("https://", "").replace("http://", "").split("/")[0]
                  if host.endswith(".azurewebsites.net"):
                      scm = host.replace(".azurewebsites.net", ".scm.azurewebsites.net")
                  else:
                      scm = host
              scm = re.sub(r"^https?://", "", scm).split(":")[0]
              return scm, pick[3], pick[4], pick[2]

          def auth_header(user, pwd):
              return "Basic " + base64.b64encode(f"{user}:{pwd}".encode()).decode()

          def kudu(scm, user, pwd, path, method="GET", body=None, empty=False, required=True):
              url = f"https://{scm}{path}"
              if empty:
                  data = b""
              elif body is None:
                  data = None
              else:
                  data = json.dumps(body).encode()
              headers = {"User-Agent": "set-sharepoint-secret", "Accept": "application/json"}
              if body is not None:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              req.add_header("Authorization", auth_header(user, pwd))
              ctx = ssl.create_default_context()
              try:
                  with urllib.request.urlopen(req, timeout=90, context=ctx) as r:
                      raw = r.read()
                      if not raw:
                          return r.status, None
                      try:
                          return r.status, json.loads(raw)
                      except json.JSONDecodeError:
                          return r.status, None
              except urllib.error.HTTPError as e:
                  err = e.read().decode("utf-8", "replace")[:300]
                  if required:
                      raise SystemExit(f"Kudu {method} {path} HTTP {e.code}: {err}") from e
                  return e.code, err

          def restart_site(scm, user, pwd, label):
              # Kudu has no /api/restart on Windows App Service. Prefer /api/app/restart;
              # deploy Internal also recycles the process. Never fail after settings match.
              for path in ("/api/app/restart", "/api/restart"):
                  code, _ = kudu(scm, user, pwd, path, method="POST", empty=True, required=False)
                  if isinstance(code, int) and 200 <= code < 300:
                      print(f"{label} restarted via {path} HTTP {code}")
                      return
                  print(f"{label} restart {path} HTTP {code} (continuing)")
              print(f"{label} app settings applied; process recycle deferred to Deploy Internal")

          def apply(xml, prefer_staging, label):
              if not (xml or "").strip():
                  raise SystemExit(f"Publish profile secret for {label} is empty")
              scm, user, pwd, dest = parse_msdeploy(xml, prefer_staging=prefer_staging)
              print(f"::add-mask::{pwd}")
              print(f"{label} SCM={scm} dest={dest}")
              kudu(scm, user, pwd, "/api/settings", method="POST", body=payload)
              _, settings = kudu(scm, user, pwd, "/api/settings")
              if not isinstance(settings, dict):
                  raise SystemExit(f"{label}: Kudu GET /api/settings did not return an object")
              present = "SharePoint__ClientSecret" in settings and bool(settings.get("SharePoint__ClientSecret"))
              matches = settings.get("SharePoint__ClientSecret") == secret
              client_id = settings.get("SharePoint__ClientId") or "(missing)"
              tenant = settings.get("SharePoint__TenantId") or "(missing)"
              timeout = settings.get("SharePoint__DownloadTimeoutSeconds") or "(missing)"
              print(f"{label} SharePoint__TenantId={tenant}")
              print(f"{label} SharePoint__ClientId={client_id}")
              print(f"{label} SharePoint__DownloadTimeoutSeconds={timeout}")
              print(f"{label} SharePoint__ClientSecret present={present} matches={matches}")
              if not matches:
                  raise SystemExit(f"{label}: App Setting SharePoint__ClientSecret did not match the GitHub secret")
              restart_site(scm, user, pwd, label)

          target = os.environ["APPLY_TARGET"]
          stg = os.environ.get("PROFILE_STAGING") or ""
          prod = os.environ.get("PROFILE_PRODUCTION") or ""
          if target in ("staging", "both"):
              apply(stg, True, "Staging")
          if target in ("production", "both"):
              apply(prod, False, "Production")
          PY
